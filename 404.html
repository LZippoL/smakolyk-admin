<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Адмінку перенесено</title></head>
<body><p>Адмінку перенесено: <a href="https://admin.culinorium.com/">admin.culinorium.com</a></p>
<script>
(async () => {
  if ('serviceWorker' in navigator) {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js');
      await registration.update();
    } catch {}
  }
  if ('caches' in window) {
    try { await Promise.all((await caches.keys()).filter(name => name.startsWith('smakolyk-admin')).map(name => caches.delete(name))); } catch {}
  }
  location.replace('https://admin.culinorium.com/');
})();
</script></body></html>
